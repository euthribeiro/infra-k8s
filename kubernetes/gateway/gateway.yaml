apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bgt3-gw
  namespace: gateway
spec:
  gatewayClassName: aws-lb-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: bgt3-gw-lbconfig
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
