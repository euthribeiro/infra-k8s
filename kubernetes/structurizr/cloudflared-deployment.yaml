apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: structurizr
spec:
  replicas: 2 # 2 réplicas do conector = alta disponibilidade do tunnel (é stateless)
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          # O token do tunnel (remotely-managed) vem do Secret cloudflared-token.
          # As regras de ingress (hostname -> serviço) ficam no painel da Cloudflare.
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: '50m'
              memory: '64Mi'
            limits:
              memory: '128Mi'
