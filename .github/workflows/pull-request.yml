name: Validação de Pull Request

on:
  pull_request:
    branches: ['master']

jobs:
  plan:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        stack: [infra, ecr, dns, email, structurizr, observability]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform fmt
        run: terraform -chdir=terraform/${{ matrix.stack }} fmt -check -diff

      - name: Terraform Init
        run: terraform -chdir=terraform/${{ matrix.stack }} init -input=false

      - name: Terraform Validate
        run: terraform -chdir=terraform/${{ matrix.stack }} validate

      - name: Terraform Plan
        env:
          STACK: ${{ matrix.stack }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_ALERT_EMAIL: ${{ vars.NEW_RELIC_ALERT_EMAIL }}
        run: |
          if [ "$STACK" = "observability" ]; then
            terraform -chdir="terraform/$STACK" plan -input=false \
              -var="newrelic_api_key=$NEW_RELIC_API_KEY" \
              -var="newrelic_account_id=$NEW_RELIC_ACCOUNT_ID" \
              -var="alert_email=$NEW_RELIC_ALERT_EMAIL"
          else
            terraform -chdir="terraform/$STACK" plan -input=false
          fi
