name: Validação de Pull Request

on:
  pull_request:
    branches: ['master']

jobs:
  plan:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        stack: [infra, ecr, dns, email, structurizr, observability]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform fmt
        run: terraform -chdir=terraform/${{ matrix.stack }} fmt -check -diff

      - name: Terraform Init
        run: terraform -chdir=terraform/${{ matrix.stack }} init -input=false

      - name: Terraform Validate
        run: terraform -chdir=terraform/${{ matrix.stack }} validate

      - name: Terraform Plan
        env:
          STACK: ${{ matrix.stack }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_ALERT_EMAIL: ${{ vars.NEW_RELIC_ALERT_EMAIL }}
        run: |
          if [ "$STACK" = "observability" ]; then
            terraform -chdir="terraform/$STACK" plan -input=false \
              -var="newrelic_api_key=$NEW_RELIC_API_KEY" \
              -var="newrelic_account_id=$NEW_RELIC_ACCOUNT_ID" \
              -var="alert_email=$NEW_RELIC_ALERT_EMAIL"
          elif [ "$STACK" = "dns" ]; then
            SAIDA=$(mktemp)
            set +e
            terraform -chdir="terraform/$STACK" plan -input=false -no-color 2>&1 | tee "$SAIDA"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -ne 0 ]; then
              if grep -q "Search returned 0 results" "$SAIDA" && grep -q "data.aws_lb.gateway" "$SAIDA"; then
                echo "::notice::Plan do stack dns/ ignorado: o ALB do Gateway não existe."
                echo "- Plan do \`dns/\` ignorado: o ALB do Gateway não existe." >> "$GITHUB_STEP_SUMMARY"
              else
                exit "$STATUS"
              fi
            fi
          else
            terraform -chdir="terraform/$STACK" plan -input=false
          fi
