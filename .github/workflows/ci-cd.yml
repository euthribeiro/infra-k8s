name: Infraestrutura Kubernetes

permissions:
  contents: read

on:
  push:
    branches: ['master']
  workflow_dispatch:
    inputs:
      etapa:
        description: 'completo aplica tudo; sem-dns aplica tudo exceto o CNAME da API; somente-dns aplica apenas o CNAME da API'
        type: choice
        default: completo
        options: ['completo', 'sem-dns', 'somente-dns']

jobs:
  main-infra:
    if: inputs.etapa != 'somente-dns'
    uses: ./.github/workflows/infra.yml
    secrets: inherit
    with:
      environment: 'production'

  ecr-infra:
    if: inputs.etapa != 'somente-dns'
    uses: ./.github/workflows/ecr-infra.yml
    secrets: inherit
    with:
      environment: 'production'

  ses-infra:
    needs: main-infra
    uses: ./.github/workflows/ses.yml
    secrets: inherit
    with:
      environment: 'production'

  structurizr:
    needs: [main-infra, ecr-infra]
    uses: ./.github/workflows/structurizr.yml
    secrets: inherit
    with:
      environment: 'production'
      cluster_name: ${{ needs.main-infra.outputs.cluster_name }}
      structurizr_chart_repository: ${{ needs.ecr-infra.outputs.structurizr_chart_repository }}
      structurizr_chart_repository_url: ${{ needs.ecr-infra.outputs.structurizr_chart_repository_url }}

  dns:
    needs: main-infra
    if: ${{ !cancelled() && inputs.etapa != 'sem-dns' && needs.main-infra.result != 'failure' }}
    uses: ./.github/workflows/dns.yml
    secrets: inherit

  newrelic-k8s:
    needs: main-infra
    uses: ./.github/workflows/newrelic.yml
    secrets: inherit
    with:
      environment: 'production'
      cluster_name: ${{ needs.main-infra.outputs.cluster_name }}

  observability:
    if: inputs.etapa != 'somente-dns'
    uses: ./.github/workflows/observability.yml
    secrets: inherit
    with:
      environment: 'production'
